name: PR checks

# Every pull request (opened, reopened, or a new push to it): the unit tests,
# the CD ripper's tests, then the browser tests - the real app in headless Chromium against a
# simulated drive built from synthetic FLAC files (test/e2e/harness.mjs).
#
# Needs no secrets and only read access, so it is safe to run for pull
# requests from forks. Nothing here can touch GitHub Pages: deploying is
# pages.yml's job, and the github-pages environment only accepts main.

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run for the superseded commit.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: avrea-ubuntu-latest-2-vcpu
    # A healthy run is a few minutes (the browser suite alone is ~1 min);
    # this only stops a hung run from eating the 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # The CD ripper (scripts/rip) is Python, run through uv. Its tests use
      # synthetic data only; no drive needed. setup-uv publishes no floating
      # major tag since v8, so this is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/rip/uv.lock

      - name: Ripper tests
        run: npm run test:rip

      # The Chromium build that matches the pinned playwright-core version.
      # Cached by that version; the system libraries it needs are installed
      # either way (apt, not cached).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright-core install --with-deps --no-shell chromium

      # CI=true (set by Actions) turns "no Chromium found" into a failure
      # instead of a skip.
      - name: Browser tests
        run: npm run test:e2e
