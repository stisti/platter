name: Deploy to GitHub Pages

# Publishes app/ as-is (there is no build step) to GitHub Pages:
# https://stisti.github.io/platter/
#
# Every push to main runs this, but it only deploys when the version in
# app/js/version.js differs from the one live on the site. So changes can be
# merged and pile up on main, and a commit that bumps the version (npm
# version patch|minor|major) releases them. That is also what makes open
# Platter windows offer the update (app/js/update.js). The live site is
# asked rather than the previous commit, so a deploy that failed is retried
# by the next push. Running the workflow by hand (workflow_dispatch) always
# deploys.
#
# Only main can deploy. Besides the branch filter below, the job runs in the
# github-pages environment, whose deployment branch policy (repo Settings ->
# Environments -> github-pages) allows main and nothing else. So a workflow
# run on any other ref - a pull request, a fork, a workflow_dispatch on a
# feature branch, or an edited copy of this file on a branch - is refused
# before it gets the token needed to deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time; queue rather than cancel, so a deploy in flight is
# never cut off half-way (and the next run sees what it published).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: avrea-ubuntu-latest-1-vcpu
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Pages is deployed from main only (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Is this a new version?
        id: release
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          EVENT: ${{ github.event_name }}
        run: |
          read_version() { sed -n "s/^export const VERSION = '\([^']*\)';.*/\1/p"; }
          version=$(read_version < app/js/version.js)
          if [ -z "$version" ]; then
            echo "::error::No VERSION found in app/js/version.js"
            exit 1
          fi
          # Unreadable (first deploy, or the site is down): deploy anyway.
          live=$(curl -fsSL --retry 3 "$SITE/js/version.js?run=$GITHUB_RUN_ID" | read_version || true)
          echo "Version in the repo: $version; live on the site: ${live:-unknown}"
          if [ "$EVENT" = workflow_dispatch ] || [ "$live" != "$version" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not deployed::$version is already live. Bump the version (npm version patch|minor|major) to release what is on main."
          fi

      - uses: actions/setup-node@v7
        if: steps.release.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm

      # The unit tests are quick, and a direct push to main skips the PR
      # checks. (The browser tests ran on the PR; not spending the minutes on
      # them twice.)
      - if: steps.release.outputs.deploy == 'true'
        run: npm ci
      - name: Unit tests
        if: steps.release.outputs.deploy == 'true'
        run: npm test

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.deploy == 'true'
        with:
          path: app

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: avrea-ubuntu-latest-1-vcpu
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages that this run is the one deploying
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
